name: Bug Report
description: Report a bug in rmustp
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "rmustp 1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Linux x86_64, macOS 14, FreeBSD 14..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
