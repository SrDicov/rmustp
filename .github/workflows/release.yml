name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rmustp dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cd dist && tar -czf ../rmustp-${{ github.ref_name }}-x86_64-linux.tar.gz *
      - name: Checksum
        run: sha256sum rmustp-*.tar.gz > rmustp-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            rmustp-*.tar.gz
            rmustp-*.tar.gz.sha256
          generate_release_notes: true
