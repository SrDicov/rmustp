[package]
name = "rmustp"
version = "1.0.0"
edition = "2021"
description = "TUI music player for POSIX systems"
license = "GPL-3.0-only"
repository = "https://github.com/SrDicov/rmustp"
homepage = "https://github.com/SrDicov/rmustp"
readme = "README.md"
keywords = ["music", "tui", "player", "cli", "posix"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
rodio = "0.20"
jpeg-decoder = "0.3"
png = "0.17"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort" # ponytail: el hook de term.rs restaura también en abort; unwind sobra (~+96KB).
